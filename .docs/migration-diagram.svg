<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 860 550" role="img" font-family="-apple-system, 'Segoe UI', system-ui, sans-serif">
  <title>Black Rust rewrite agent pipeline</title>
  <desc>Migration from the original Pokémon Black assembly (black-rom/) to a Rust port (black-rust/). The orchestrator keeps its roadmap checklist and bug list in memory/ and dispatches function, feature and architect workers. Workers read the assembly input, use tools/, and produce the Rust output, which builds a Bevy app for native and wasm. A validator runs end-to-end UI and integration tests on the output and adds bugs to memory/.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9z" fill="#555"/>
    </marker>
    <style>
      .box  { fill: #fbfbfa; stroke: #444; stroke-width: 1.2; }
      .hero { fill: #fdecea; stroke: #b5473a; stroke-width: 1.5; }
      .grp  { fill: none; stroke: #888; stroke-width: 1; stroke-dasharray: 5 4; }
      .gout { fill: #e7f5ea; stroke: #3d8a52; stroke-width: 1.8; }
      .hk   { fill: #fdf1e3; stroke: #c27a2c; }
      .sn   { fill: #f1ebf9; stroke: #7a52b3; }
      .op   { fill: #e9f0fb; stroke: #3f6fb5; }
      .wd   { fill: #fbf6dc; stroke: #a8902a; }
      .out  { fill: #eef1f3; stroke: #444; stroke-width: 1.5; }
      .ln   { stroke: #555; stroke-width: 1.3; fill: none; }
      .dash { stroke: #888; stroke-width: 1.2; fill: none; stroke-dasharray: 4 3; }
      .t    { font-size: 14px; font-weight: 600; fill: #222; text-anchor: middle; }
      .s    { font-size: 11px; fill: #555; text-anchor: middle; }
      .m    { font-size: 11.5px; fill: #333; font-family: ui-monospace, Menlo, monospace; }
      .h    { font-size: 12px; font-weight: 600; fill: #555; }
      .hg   { font-size: 12px; font-weight: 600; fill: #2f6e41; }
    </style>
  </defs>

  <!-- Orchestrator -->
  <rect class="box hero" x="330" y="20" width="200" height="54" rx="6"/>
  <text class="t" x="430" y="52">Orchestrator</text>

  <!-- Memory -->
  <rect class="box" x="646" y="10" width="190" height="74" rx="6"/>
  <text class="h" x="660" y="29">memory/</text>
  <text class="m" x="660" y="51">ROADMAP-CHECKLIST.md</text>
  <text class="m" x="660" y="69">BUGS-TO-FIX.md</text>
  <line class="ln" x1="532" y1="38" x2="644" y2="38" marker-start="url(#a)" marker-end="url(#a)"/>

  <!-- Validator -->
  <rect class="box wd" x="646" y="110" width="190" height="50" rx="6"/>
  <text class="t" x="741" y="130">Validator</text>
  <text class="s" x="741" y="148">end-to-end UI + integration tests</text>
  <line class="ln" x1="741" y1="108" x2="741" y2="86" marker-end="url(#a)"/>
  <path class="ln" d="M532 64 H600 V135 H644" marker-end="url(#a)"/>

  <!-- Dispatch / report between orchestrator and workers -->
  <line class="ln" x1="410" y1="74" x2="410" y2="162" marker-end="url(#a)"/>
  <line class="ln" x1="450" y1="162" x2="450" y2="76" marker-end="url(#a)"/>

  <!-- Workers group -->
  <rect class="grp" x="250" y="164" width="360" height="172" rx="8"/>
  <text class="h" x="262" y="182">workers · one git worktree each</text>
  <rect class="box hk" x="264" y="190" width="332" height="40" rx="5"/>
  <text class="t" x="430" y="207">Function Worker (Haiku)</text>
  <text class="s" x="430" y="222">leaf functions with a harness</text>
  <rect class="box sn" x="264" y="236" width="332" height="40" rx="5"/>
  <text class="t" x="430" y="253">Feature Worker (Sonnet)</text>
  <text class="s" x="430" y="268">flow code · harness jobs · UI screens</text>
  <rect class="box op" x="264" y="282" width="332" height="40" rx="5"/>
  <text class="t" x="430" y="299">Architect Worker (Opus)</text>
  <text class="s" x="430" y="314">SEQ · scaffolding · hard specs</text>

  <!-- Assembly input (left) -->
  <rect class="box" x="24" y="164" width="190" height="70" rx="6"/>
  <text class="t" x="119" y="187">[Input] Assembly ROM</text>
  <text class="s" x="119" y="205">black-rom/</text>
  <text class="s" x="119" y="221">Pokémon Black (NDS)</text>
  <line class="ln" x1="214" y1="199" x2="248" y2="199" marker-end="url(#a)"/>
  <line class="ln" x1="119" y1="234" x2="119" y2="244" marker-end="url(#a)"/>

  <!-- tools/ (left) -->
  <rect class="box" x="24" y="246" width="190" height="184" rx="6"/>
  <text class="h" x="38" y="266">tools/</text>
  <rect class="box" x="38" y="278" width="162" height="30" rx="4"/>
  <text class="t" x="119" y="298" style="font-size:12px">rom-diff · Unicorn</text>
  <rect class="box" x="38" y="314" width="162" height="30" rx="4"/>
  <text class="t" x="119" y="334" style="font-size:12px">ui-diff · DeSmuME</text>
  <rect class="box" x="38" y="350" width="162" height="30" rx="4"/>
  <text class="t" x="119" y="370" style="font-size:12px">decompile · pseudo-C</text>
  <rect class="box" x="38" y="386" width="162" height="30" rx="4"/>
  <text class="t" x="119" y="406" style="font-size:12px">rizin · rea MCP</text>
  <line class="ln" x1="250" y1="300" x2="216" y2="300" marker-end="url(#a)"/>

  <!-- Output (bottom of the funnel) -->
  <line class="ln" x1="430" y1="336" x2="430" y2="378" marker-end="url(#a)"/>
  <rect class="gout" x="250" y="380" width="360" height="156" rx="8"/>
  <rect class="box" x="266" y="396" width="328" height="56" rx="6"/>
  <text class="t" x="430" y="419">[Output] Rust Port</text>
  <text class="s" x="430" y="437">black-rust/ · faithful port</text>
  <line class="ln" x1="430" y1="452" x2="430" y2="468" marker-end="url(#a)"/>
  <rect class="box out" x="266" y="470" width="328" height="50" rx="6"/>
  <text class="t" x="430" y="491">Bevy App</text>
  <text class="s" x="430" y="508">native · wasm (WebGL2)</text>

  <!-- Validator tests against the Rust port -->
  <path class="dash" d="M741 162 V424 H596" marker-end="url(#a)"/>
</svg>
